      - Bearer: []
      summary: 与某人的消息列表
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: |-
        会话不存在时自动创建。收件人来自路径，发件人来自 token。
        可选 client_msg_id 作幂等键：同一个 key 重复提交只落一条，返回第一次那条。
      parameters:
      - description: 收件人 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 消息正文 1~1000 字符；client_msg_id 可选
        in: body
        name: body
        required: true
        schema:
