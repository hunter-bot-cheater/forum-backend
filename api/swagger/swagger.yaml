basePath: /api
definitions:
  article.articleListResp:
    properties:
      list:
        description: articleListResp.List 声明成切片，
        items:
          $ref: '#/definitions/article.articleResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  article.articleResp:
    properties:
      author:
        $ref: '#/definitions/article.userBrief'
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  article.createArticleReq:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  article.userBrief:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  comment.commentListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/comment.commentResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  comment.commentResp:
    properties:
      article_id:
        type: integer
      author:
        allOf:
        - $ref: '#/definitions/comment.userBrief'
        description: Author 用指针，omitempty 才生效
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
    type: object
  comment.createCommentReq:
    properties:
      content:
        type: string
    type: object
  comment.userBrief:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  floor.createEventReq:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      lucky_floors:
        items:
          type: integer
        type: array
      starts_at:
        type: string
      title:
        type: string
    type: object
  floor.eventResp:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      id:
        type: integer
      lucky_floors:
        items:
          type: integer
        type: array
      next_floor:
        type: integer
      starts_at:
        type: string
      title:
        type: string
      winners:
        items:
          $ref: '#/definitions/floor.winnerResp'
        type: array
    type: object
  floor.grabReq:
    properties:
      content:
        type: string
    type: object
  floor.grabResp:
    properties:
      floor:
        type: integer
      message:
        type: string
      won:
        type: boolean
    type: object
  floor.winnerResp:
    properties:
      content:
        type: string
      created_at:
        type: string
      floor:
        type: integer
      user_id:
        type: integer
    type: object
  hot.HotArticleResp:
    properties:
      article_id:
        type: integer
      like_count:
        type: integer
      score:
        type: number
      title:
        type: string
    type: object
  hot.HotListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/hot.HotArticleResp'
        type: array
    type: object
  httputil.SwaggerEnvelope:
    properties:
      code:
        type: integer
      data: {}
      error_code:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  like.likeResp:
    properties:
      article_id:
        type: integer
      changed:
        type: boolean
      like_count:
        type: integer
      liked:
        type: boolean
    type: object
  notification.notificationListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/notification.notificationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      unread_count:
        type: integer
    type: object
  notification.notificationResp:
    properties:
      actor_id:
        type: integer
      article_id:
        type: integer
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      target_id:
        type: integer
      target_type:
        type: string
      type:
        type: string
    type: object
  user.loginResp:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.userResp'
    type: object
  user.registerReq:
    properties:
      password:
        type: string
      username:
        description: Gin 内置的参数校验，字段没传或为空就自动报参数错误
        type: string
    required:
    - password
    - username
    type: object
  user.userResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  ws.onlineStatsResp:
    properties:
      online_conns:
        type: integer
      online_users:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 社区论坛后端学习项目，统一响应格式为 { code, message, data }；失败响应额外带 error_code 与 request_id
  title: Forum Backend API
  version: "1.0"
paths:
  /articles:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleListResp'
              type: object
        "400":
          description: 分页参数越界
          schema:
            type: string
      summary: 文章分页列表
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: 标题与正文
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/article.createArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleResp'
              type: object
        "400":
          description: 请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发布文章
      tags:
      - articles
  /articles/{id}:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleResp'
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      summary: 文章详情
      tags:
      - articles
  /articles/{id}/comments:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentListResp'
              type: object
        "400":
          description: id 或分页参数不正确
          schema:
            type: string
      summary: 文章评论列表
      tags:
      - comments
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/comment.createCommentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentResp'
              type: object
        "400":
          description: id 或请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发表评论
      tags:
      - comments
  /articles/{id}/like:
    delete:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/like.likeResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 取消点赞
      tags:
      - likes
    put:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/like.likeResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 点赞文章
      tags:
      - likes
  /articles/hot:
    get:
      parameters:
      - description: 返回条数，默认 10，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/hot.HotListResp'
              type: object
        "400":
          description: limit 非法
          schema:
            type: string
      summary: 热门文章 Top N
      tags:
      - likes
  /comments/{id}:
    delete:
      parameters:
      - description: 评论 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "403":
          description: 只能删除自己的评论
          schema:
            type: string
        "404":
          description: 评论不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 删除自己的评论
      tags:
      - comments
  /floor-events:
    post:
      consumes:
      - application/json
      parameters:
      - description: 活动配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/floor.createEventReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/floor.eventResp'
              type: object
        "400":
          description: 配置不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 创建抢楼活动
      tags:
      - floors
  /floor-events/{id}:
    get:
      parameters:
      - description: 活动 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/floor.eventResp'
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "404":
          description: 活动不存在
          schema:
            type: string
      summary: 抢楼活动详情与中奖名单
      tags:
      - floors
  /floor-events/{id}/grab:
    post:
      consumes:
      - application/json
      parameters:
      - description: 活动 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 抢楼内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/floor.grabReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/floor.grabResp'
              type: object
        "400":
          description: 参数不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 活动不存在
          schema:
            type: string
        "409":
          description: 活动未在进行中，或这一楼已被抢走
          schema:
            type: string
      security:
      - Bearer: []
      summary: 抢一次楼
      tags:
      - floors
  /floor-events/{id}/mine:
    get:
      parameters:
      - description: 活动 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/floor.winnerResp'
                  type: array
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 我抢到的中奖楼层
      tags:
      - floors
  /login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名与密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/user.loginResp'
              type: object
        "401":
          description: 凭据错误
          schema:
            type: string
      summary: 用户登录
      tags:
      - users
  /notifications:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/notification.notificationListResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 站内通知列表
      tags:
      - notifications
  /notifications/read-all:
    put:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.SwaggerEnvelope'
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 标记全部通知已读
      tags:
      - notifications
  /register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名与密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.registerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/user.userResp'
              type: object
        "400":
          description: 请求体格式不正确
          schema:
            type: string
        "409":
          description: 用户名已存在
          schema:
            type: string
      summary: 用户注册
      tags:
      - users
  /ws/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/ws.onlineStatsResp'
              type: object
      summary: 当前在线人数与连接数
      tags:
      - realtime
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
