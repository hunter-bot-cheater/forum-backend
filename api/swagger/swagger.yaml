basePath: /api
definitions:
  article.TagCount:
    properties:
      count:
        type: integer
      name:
        type: string
    type: object
  article.articleDetailResp:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      liked:
        description: |-
          Liked 是「当前访问者点过没」，决定详情页的点赞按钮要不要点亮。

          它只取决于发请求的人，所以不跟着文章进缓存——缓存键里没有用户维度，
          存进去就会让 A 点过赞之后 B 也看到高亮的按钮。
          游客（没登录或 token 过期）恒为 false：没有身份就无从判断。
        type: boolean
      tags:
        description: Tags 是这篇文章挂的标签名，发布与编辑之后前端直接拿它回显。
        items:
          type: string
        type: array
      title:
        type: string
      view_count:
        description: |-
          ViewCount 是库里的浏览数。缓存里也存了一份，但 handler 会用
          ViewCount() 查到的实时值覆盖它（见 Detail），因为缓存里的值只是
          回填那一刻的快照，展示出来会偏旧甚至变小。
        type: integer
    type: object
  article.articleListItem:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: integer
      tags:
        description: |-
          Tags 是这篇文章挂的标签名，按标签筛选时前端靠它高亮当前标签，
          也让卡片上能显示「这篇属于什么」。
        items:
          type: string
        type: array
      title:
        type: string
      view_count:
        description: |-
          ViewCount 给列表卡片上那行小字用。它是详情缓存之外的一份库内值，
          可能比详情页刚显示的数字略旧（详情页会补上本次访问的一次），
          但列表本来就不需要精确到个位。
        type: integer
    type: object
  article.articleListResp:
    properties:
      list:
        description: |-
          List 声明成切片而不是指针，且调用方保证给它空切片而非 nil，
          这样没有数据时序列化出来是 []，不会变成 null。
        items:
          $ref: '#/definitions/article.articleListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  article.articleResp:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      tags:
        description: Tags 是这篇文章挂的标签名，发布与编辑之后前端直接拿它回显。
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  article.createArticleReq:
    properties:
      content:
        type: string
      tags:
        description: |-
          Tags 是标签名，最多 3 个、每个最长 32 字，具体校验在 service 的 normalizeTags。
          用名字而不是 tag id：前端发帖时标签可能是当场新建的，还没有 id。
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  article.tagListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/article.TagCount'
        type: array
    type: object
  article.tagSuggestReq:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  article.tagSuggestResp:
    properties:
      tag:
        type: string
    type: object
  comment.commentAnchorResp:
    properties:
      article_id:
        type: integer
      comment_id:
        type: integer
      index:
        description: Index 是所属根评论在文章里的序号，从 1 开始。
        type: integer
      root_id:
        description: RootID 是所属根评论的 id，定位到回复时前端靠它先找到外层容器。
        type: integer
    type: object
  comment.commentListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/comment.commentResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  comment.commentResp:
    properties:
      article_id:
        type: integer
      author:
        allOf:
        - $ref: '#/definitions/user.BriefResp'
        description: Author 用指针，omitempty 才生效
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      parent_id:
        description: |-
          ParentID / RootID 让前端知道这条是回复谁、属于哪棵树。
          顶级评论两者都是 0。
        type: integer
      replies:
        description: |-
          Replies 只出现在根评论上，装这一页展示的回复。
          ReplyCount 是真实总数，可能大于 len(Replies)（被 maxRepliesPerRoot 截断）。

          没有回复时这个字段会被省略，而不是输出 []：
          encoding/json 的 omitempty 对空切片同样生效（长度 0 就省略），
          想输出 [] 就必须去掉 omitempty，但那样每条回复也会多一个 "replies": null。
          折中是保持省略，前端按「没有回复」处理时用 `item.replies ?? []`。
        items:
          $ref: '#/definitions/comment.commentResp'
        type: array
      reply_count:
        type: integer
      reply_to:
        allOf:
        - $ref: '#/definitions/user.BriefResp'
        description: |-
          ReplyTo 是被回复者的展示信息，前端显示成「回复 @张三」。
          只在回复里有值；被回复者账号注销时省略整个字段。
      root_id:
        type: integer
    type: object
  comment.createCommentReq:
    properties:
      content:
        type: string
      parent_id:
        description: |-
          ParentID 大于 0 表示这是一条回复，指向被回复的评论。
          不填就是顶级评论，行为与加回复功能之前完全一致。
        type: integer
    type: object
  floor.createEventReq:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      lucky_floors:
        items:
          type: integer
        type: array
      starts_at:
        type: string
      title:
        type: string
    type: object
  floor.eventResp:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      id:
        type: integer
      lucky_floors:
        items:
          type: integer
        type: array
      next_floor:
        type: integer
      starts_at:
        type: string
      title:
        type: string
      winners:
        items:
          $ref: '#/definitions/floor.winnerResp'
        type: array
    type: object
  floor.grabReq:
    properties:
      content:
        type: string
    type: object
  floor.grabResp:
    properties:
      floor:
        type: integer
      message:
        type: string
      won:
        type: boolean
    type: object
  floor.winnerResp:
    properties:
      content:
        type: string
      created_at:
        type: string
      floor:
        type: integer
      user_id:
        type: integer
    type: object
  follow.followItemResp:
    properties:
      avatar_url:
        type: string
      followed_at:
        type: string
      followed_by_me:
        type: boolean
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  follow.followListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/follow.followItemResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  follow.followStateResp:
    properties:
      changed:
        type: boolean
      follower_count:
        type: integer
      following:
        type: boolean
    type: object
  hot.HotArticleResp:
    properties:
      article_id:
        type: integer
      like_count:
        type: integer
      score:
        type: number
      title:
        type: string
    type: object
  hot.HotListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/hot.HotArticleResp'
        type: array
    type: object
  httputil.SwaggerEnvelope:
    properties:
      code:
        type: integer
      data: {}
      error_code:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  like.likeResp:
    properties:
      article_id:
        type: integer
      changed:
        type: boolean
      like_count:
        type: integer
      liked:
        type: boolean
    type: object
  message.conversationListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/message.conversationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  message.conversationResp:
    properties:
      last_message:
        $ref: '#/definitions/message.messageResp'
      peer:
        $ref: '#/definitions/user.BriefResp'
      unread:
        type: integer
      updated_at:
        type: string
    type: object
  message.messageListResp:
    properties:
      has_more:
        type: boolean
      list:
        items:
          $ref: '#/definitions/message.messageResp'
        type: array
      next_before_id:
        type: integer
      peer:
        $ref: '#/definitions/user.BriefResp'
    type: object
  message.messageResp:
    properties:
      client_msg_id:
        description: |-
          ClientMsgID 回显客户端传的幂等键，前端用它把「先画出来的灰气泡」
          换成服务端这条（拿到真实 id 和时间）。没传就不输出这个字段。
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      mine:
        description: |-
          Mine 表示这条是不是我发的，前端据此决定气泡靠左还是靠右。
          让服务端算：前端拿自己的 id 和 SenderID 比也能算，但会话列表里
          「最后一条是不是我发的」也要用同一个判断，两处写容易不一致。
        type: boolean
      read_at:
        type: string
      sender_id:
        type: integer
    type: object
  message.readResp:
    properties:
      cleared:
        type: integer
    type: object
  message.sendReq:
    properties:
      client_msg_id:
        description: |-
          ClientMsgID 是客户端生成的幂等键（建议 UUID），可留空。
          留空表示这条消息不参与去重；填了就保证「同一个 key 只落一条」，
          弱网重试、用户双击发送都不会产生重复气泡。
        type: string
      content:
        type: string
    type: object
  message.unreadResp:
    properties:
      unread:
        type: integer
    type: object
  notification.notificationListResp:
    properties:
      kind:
        description: |-
          Kind 回显本次查询的分类（空串表示全部）。
          前端连续切 tab 时可能有多个请求在飞，靠回显判断「这一页属于哪个 tab」，
          否则慢的那次会把当前 tab 的列表覆盖成上一个 tab 的内容。
        type: string
      list:
        items:
          $ref: '#/definitions/notification.notificationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      unread_count:
        type: integer
    type: object
  notification.notificationResp:
    properties:
      actor:
        allOf:
        - $ref: '#/definitions/user.BriefResp'
        description: |-
          Actor 是触发者的昵称头像，前端靠它显示「谁赞了你」。
          用指针加 omitempty：账号注销后查不到资料，此时整个字段省掉，
          前端拿 actor_id 也画不出有效内容，直接按「有人」兜底。
          actor_id 仍然保留：它是稳定标识，点击跳主页时用得上。
      actor_id:
        type: integer
      article_id:
        type: integer
      article_title:
        description: |-
          ArticleTitle 是互动发生在哪篇文章的标题，让用户不必点进去才知道是哪篇。
          文章已删（或非文章域事件 article_id=0）时为空，omitempty 让字段整个不出现，
          前端据此决定要不要渲染标题行。
        type: string
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      target_id:
        type: integer
      target_type:
        type: string
      type:
        type: string
    type: object
  notification.unreadSummaryResp:
    properties:
      by_kind:
        additionalProperties:
          format: int64
          type: integer
        type: object
      total:
        type: integer
    type: object
  session.Tokens:
    properties:
      access_token:
        type: string
      expires_in:
        description: |-
          ExpiresIn 是 access token 剩余秒数，前端据此提前刷新，
          而不是等请求 401 了才去刷（那样每次刷新都要多花一个往返）。
        type: integer
      refresh_token:
        type: string
    type: object
  user.BriefResp:
    properties:
      avatar_url:
        type: string
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  user.loginResp:
    properties:
      access_token:
        type: string
      expires_in:
        description: |-
          ExpiresIn 是 access token 剩余秒数，前端据此提前刷新，
          而不是等请求 401 了才去刷（那样每次刷新都要多花一个往返）。
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/user.userResp'
    type: object
  user.profileResp:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      has_custom_nickname:
        description: |-
          HasCustomNickname 表示用户在库里真的设过昵称。
          Nickname 是展示名（空时已回退成 Username），光看它分不清
          「用户设了昵称且刚好等于用户名」和「用户没设昵称」。
          个人中心的编辑表单靠这个布尔值决定输入框回填昵称还是回填空串。
        type: boolean
      id:
        type: integer
      is_following:
        description: IsFollowing 表示当前登录用户是否关注了这个人，未登录时固定 false。
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  user.refreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  user.registerReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.updateProfileReq:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      nickname:
        type: string
    type: object
  user.userResp:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      has_custom_nickname:
        description: |-
          HasCustomNickname 表示用户在库里真的设过昵称。
          Nickname 是展示名（空时已回退成 Username），光看它分不清
          「用户设了昵称且刚好等于用户名」和「用户没设昵称」。
          个人中心的编辑表单靠这个布尔值决定输入框回填昵称还是回填空串。
        type: boolean
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  ws.onlineStatsResp:
    properties:
      online_conns:
        type: integer
      online_users:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 社区论坛后端学习项目，统一响应格式为 { code, message, data }；失败响应额外带 error_code 与 request_id
  title: Forum Backend API
  version: "1.0"
paths:
  /articles:
    get:
      description: 可按作者、关键词或标签筛选；关键词同时匹配标题与正文，不区分大小写
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      - description: 只看某个作者的文章，不传为全站
        in: query
        name: author_id
        type: integer
      - description: 搜索关键词，同时匹配标题与正文，最长 50 字
        in: query
        name: keyword
        type: string
      - description: 只看带这个标签的文章，按名字精确匹配
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleListResp'
              type: object
        "400":
          description: 分页参数越界、author_id 非法、关键词或标签过长
          schema:
            type: string
      summary: 文章分页列表
      tags:
      - articles
    post:
      consumes:
      - application/json
      description: tags 留空时，若服务端开启了 llm.enabled，会自动生成一个标签；生成失败不影响发布
      parameters:
      - description: 标题、正文与标签（标签可为空数组）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/article.createArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleResp'
              type: object
        "400":
          description: 请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发布文章
      tags:
      - articles
  /articles/{id}:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleDetailResp'
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      summary: 文章详情
      tags:
      - articles
    put:
      consumes:
      - application/json
      description: 只允许作者本人；标题与正文都必填，规则与发布完全一致。
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 标题与正文
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/article.createArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleDetailResp'
              type: object
        "400":
          description: id 或请求体格式不正确、标题正文不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章不存在或不属于当前用户
          schema:
            type: string
      security:
      - Bearer: []
      summary: 编辑文章
      tags:
      - articles
  /articles/{id}/comments:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentListResp'
              type: object
        "400":
          description: id 或分页参数不正确
          schema:
            type: string
      summary: 文章评论列表
      tags:
      - comments
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容与可选的 parent_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/comment.createCommentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentResp'
              type: object
        "400":
          description: id 或请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章或父评论不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发表评论
      tags:
      - comments
  /articles/{id}/like:
    delete:
      parameters:
      - description: 文章 ID
        in: path
        name: id
