basePath: /api
definitions:
  article.articleDetailResp:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      title:
        type: string
    type: object
  article.articleListItem:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      created_at:
        type: string
      excerpt:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  article.articleListResp:
    properties:
      list:
        description: |-
          List 声明成切片而不是指针，且调用方保证给它空切片而非 nil，
          这样没有数据时序列化出来是 []，不会变成 null。
        items:
          $ref: '#/definitions/article.articleListItem'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  article.articleResp:
    properties:
      author:
        $ref: '#/definitions/user.BriefResp'
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  article.createArticleReq:
    properties:
      content:
        type: string
      title:
        type: string
    type: object
  comment.commentListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/comment.commentResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  comment.commentResp:
    properties:
      article_id:
        type: integer
      author:
        allOf:
        - $ref: '#/definitions/user.BriefResp'
        description: Author 用指针，omitempty 才生效
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
    type: object
  comment.createCommentReq:
    properties:
      content:
        type: string
    type: object
  floor.createEventReq:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      lucky_floors:
        items:
          type: integer
        type: array
      starts_at:
        type: string
      title:
        type: string
    type: object
  floor.eventResp:
    properties:
      article_id:
        type: integer
      ends_at:
        type: string
      id:
        type: integer
      lucky_floors:
        items:
          type: integer
        type: array
      next_floor:
        type: integer
      starts_at:
        type: string
      title:
        type: string
      winners:
        items:
          $ref: '#/definitions/floor.winnerResp'
        type: array
    type: object
  floor.grabReq:
    properties:
      content:
        type: string
    type: object
  floor.grabResp:
    properties:
      floor:
        type: integer
      message:
        type: string
      won:
        type: boolean
    type: object
  floor.winnerResp:
    properties:
      content:
        type: string
      created_at:
        type: string
      floor:
        type: integer
      user_id:
        type: integer
    type: object
  follow.followItemResp:
    properties:
      avatar_url:
        type: string
      followed_at:
        type: string
      followed_by_me:
        type: boolean
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  follow.followListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/follow.followItemResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  follow.followStateResp:
    properties:
      changed:
        type: boolean
      follower_count:
        type: integer
      following:
        type: boolean
    type: object
  hot.HotArticleResp:
    properties:
      article_id:
        type: integer
      like_count:
        type: integer
      score:
        type: number
      title:
        type: string
    type: object
  hot.HotListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/hot.HotArticleResp'
        type: array
    type: object
  httputil.SwaggerEnvelope:
    properties:
      code:
        type: integer
      data: {}
      error_code:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  like.likeResp:
    properties:
      article_id:
        type: integer
      changed:
        type: boolean
      like_count:
        type: integer
      liked:
        type: boolean
    type: object
  message.conversationListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/message.conversationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  message.conversationResp:
    properties:
      last_message:
        $ref: '#/definitions/message.messageResp'
      peer:
        $ref: '#/definitions/user.BriefResp'
      unread:
        type: integer
      updated_at:
        type: string
    type: object
  message.messageListResp:
    properties:
      has_more:
        type: boolean
      list:
        items:
          $ref: '#/definitions/message.messageResp'
        type: array
      next_before_id:
        type: integer
      peer:
        $ref: '#/definitions/user.BriefResp'
    type: object
  message.messageResp:
    properties:
      client_msg_id:
        description: |-
          ClientMsgID 回显客户端传的幂等键，前端用它把「先画出来的灰气泡」
          换成服务端这条（拿到真实 id 和时间）。没传就不输出这个字段。
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      mine:
        description: |-
          Mine 表示这条是不是我发的，前端据此决定气泡靠左还是靠右。
          让服务端算：前端拿自己的 id 和 SenderID 比也能算，但会话列表里
          「最后一条是不是我发的」也要用同一个判断，两处写容易不一致。
        type: boolean
      read_at:
        type: string
      sender_id:
        type: integer
    type: object
  message.readResp:
    properties:
      cleared:
        type: integer
    type: object
  message.sendReq:
    properties:
      client_msg_id:
        description: |-
          ClientMsgID 是客户端生成的幂等键（建议 UUID），可留空。
          留空表示这条消息不参与去重；填了就保证「同一个 key 只落一条」，
          弱网重试、用户双击发送都不会产生重复气泡。
        type: string
      content:
        type: string
    type: object
  message.unreadResp:
    properties:
      unread:
        type: integer
    type: object
  notification.notificationListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/notification.notificationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      unread_count:
        type: integer
    type: object
  notification.notificationResp:
    properties:
      actor_id:
        type: integer
      article_id:
        type: integer
      created_at:
        type: string
      event_id:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      target_id:
        type: integer
      target_type:
        type: string
      type:
        type: string
    type: object
  user.BriefResp:
    properties:
      avatar_url:
        type: string
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  user.loginResp:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.userResp'
    type: object
  user.profileResp:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      has_custom_nickname:
        description: |-
          HasCustomNickname 表示用户在库里真的设过昵称。
          Nickname 是展示名（空时已回退成 Username），光看它分不清
          「用户设了昵称且刚好等于用户名」和「用户没设昵称」。
          个人中心的编辑表单靠这个布尔值决定输入框回填昵称还是回填空串。
        type: boolean
      id:
        type: integer
      is_following:
        description: IsFollowing 表示当前登录用户是否关注了这个人，未登录时固定 false。
        type: boolean
      nickname:
        type: string
      username:
        type: string
    type: object
  user.registerReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  user.updateProfileReq:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      nickname:
        type: string
    type: object
  user.userResp:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      created_at:
        type: string
      has_custom_nickname:
        description: |-
          HasCustomNickname 表示用户在库里真的设过昵称。
          Nickname 是展示名（空时已回退成 Username），光看它分不清
          「用户设了昵称且刚好等于用户名」和「用户没设昵称」。
          个人中心的编辑表单靠这个布尔值决定输入框回填昵称还是回填空串。
        type: boolean
      id:
        type: integer
      nickname:
        type: string
      username:
        type: string
    type: object
  ws.onlineStatsResp:
    properties:
      online_conns:
        type: integer
      online_users:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 社区论坛后端学习项目，统一响应格式为 { code, message, data }；失败响应额外带 error_code 与 request_id
  title: Forum Backend API
  version: "1.0"
paths:
  /articles:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleListResp'
              type: object
        "400":
          description: 分页参数越界
          schema:
            type: string
      summary: 文章分页列表
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: 标题与正文
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/article.createArticleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleResp'
              type: object
        "400":
          description: 请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发布文章
      tags:
      - articles
  /articles/{id}:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/article.articleDetailResp'
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      summary: 文章详情
      tags:
      - articles
  /articles/{id}/comments:
    get:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最大 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentListResp'
              type: object
        "400":
          description: id 或分页参数不正确
          schema:
            type: string
      summary: 文章评论列表
      tags:
      - comments
    post:
      consumes:
      - application/json
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/comment.createCommentReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/comment.commentResp'
              type: object
        "400":
          description: id 或请求体格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 发表评论
      tags:
      - comments
  /articles/{id}/like:
    delete:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/like.likeResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 取消点赞
      tags:
      - likes
    put:
      parameters:
      - description: 文章 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/like.likeResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 文章不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 点赞文章
      tags:
      - likes
  /articles/hot:
    get:
      parameters:
      - description: 返回条数，默认 10，最大 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/hot.HotListResp'
              type: object
        "400":
          description: limit 非法
          schema:
            type: string
      summary: 热门文章 Top N
      tags:
      - likes
  /comments/{id}:
    delete:
      parameters:
      - description: 评论 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "403":
          description: 只能删除自己的评论
          schema:
            type: string
        "404":
          description: 评论不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 删除自己的评论
      tags:
      - comments
  /conversations:
    get:
      description: 按最后消息时间倒序，带对方资料、最后一条消息与未读数。
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10，最多 50
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/message.conversationListResp'
              type: object
        "400":
          description: 分页参数不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 我的会话列表
      tags:
      - messages
  /conversations/unread:
    get:
      description: 供顶部角标使用，不区分会话。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/message.unreadResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 我的未读私信总数
      tags:
      - messages
  /conversations/with/{user_id}/messages:
    get:
      description: 游标分页：不传 before_id 取最新一页，往上翻时把上一页的 next_before_id 作为 before_id 传回来；同页内按时间正序。
      parameters:
      - description: 对方的用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 游标：只取 id 小于它的消息，缺省 0 表示最新一页
        in: query
        name: before_id
        type: integer
      - description: 每页条数，默认 20，最多 50
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/message.messageListResp'
              type: object
        "400":
          description: 分页参数不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 用户不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 与某人的消息列表
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: |-
        会话不存在时自动创建。收件人来自路径，发件人来自 token。
        可选 client_msg_id 作幂等键：同一个 key 重复提交只落一条，返回第一次那条。
      parameters:
      - description: 收件人 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 消息正文 1~1000 字符；client_msg_id 可选
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/message.sendReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/message.messageResp'
              type: object
        "400":
          description: 正文为空或超长
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
        "404":
          description: 收件人不存在
          schema:
            type: string
      security:
      - Bearer: []
      summary: 给某人发私信
      tags:
      - messages
  /conversations/with/{user_id}/read:
    put:
      description: 幂等，已读状态下调用返回 cleared=0，不报错。
      parameters:
      - description: 对方的用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/message.readResp'
              type: object
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 把与某人的会话标记为已读
      tags:
      - messages
  /floor-events:
    post:
      consumes:
      - application/json
      parameters:
      - description: 活动配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/floor.createEventReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/floor.eventResp'
              type: object
        "400":
          description: 配置不合法
          schema:
            type: string
        "401":
          description: 未登录
          schema:
            type: string
      security:
      - Bearer: []
      summary: 创建抢楼活动
      tags:
      - floors
  /floor-events/{id}:
    get:
      parameters:
      - description: 活动 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.SwaggerEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/floor.eventResp'
              type: object
        "400":
          description: id 格式不正确
          schema:
            type: string
        "404":
          description: 活动不存在
          schema:
            type: string
      summary: 抢楼活动详情与中奖名单
