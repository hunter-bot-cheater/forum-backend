      - description: 对方的用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 游标：只取 id 小于它的消息，缺省 0 表示最新一页
        in: query
        name: before_id
        type: integer
      - description: 每页条数，默认 20，最多 50
