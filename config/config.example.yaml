# 这是 config.yaml 的安全模板（会被提交到 Git）。
# 使用方式：克隆仓库后，把本文件复制为 config/config.yaml，填上你自己的值。
# config/config.yaml 已写入 .gitignore，不会上传，避免泄露密码。
# 配置文件里出现的键都能用同名环境变量覆盖，点号换成下划线：
#   export MYSQL_PASSWORD=xxx
#   export REDIS_PASSWORD=xxx
#   export JWT_SECRET=xxx
# 启动要求 JWT_SECRET 至少 32 个随机字符，公开占位值会被拒绝。
# 键名带完整层级，例如 SERVER_TRUSTED_PROXIES=127.0.0.1,10.0.0.0/8，列表用逗号分隔。

server:
  port: 8080
  # gin 默认信任所有代理，会让 X-Forwarded-For 伪造绕过按 IP 限流，这里必须显式给值。
  # 留空：c.ClientIP() 取直连 IP，最安全，本机开发用这个。
  # 内网穿透：穿透客户端从本机连进来，填 "127.0.0.1"（IPv6 回环则填 "::1"）。
  # 服务器 Nginx：填反代所在的 IP 或网段，例如 "127.0.0.1" 或 "10.0.0.0/8"。
  # 只在确认反代会追加或覆盖真实客户端 IP 时才填；绝不要写 "0.0.0.0/0"。
  trusted_proxies: []

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  # 本地开发填你自己的 MySQL 密码；不要写真实密码进被提交的配置。
  # 部署建议用环境变量 MYSQL_PASSWORD 覆盖。
  password: "your_mysql_password"
  dbname: forum
  # 启动时按模型自动建表 / 补列。本机开着方便，改完模型重启就生效。
  # 生产改成 false，改表走独立的迁移命令（见 config/config.production.yaml 与 make migrate）。
  auto_migrate: true
  # 慢查询阈值（毫秒）。执行时间超过它的 SQL 会打一条 warn 日志，带上 sql 与 request_id。
  slow_query_ms: 200

redis:
  addr: 127.0.0.1:6379
  # 同上，真实密码请用环境变量 REDIS_PASSWORD 覆盖。
  password: "your_redis_password"
  db: 0

jwt:
  # 留空会让启动直接报错，用 JWT_SECRET 或本地填一个随机长串。
  secret: ""
  # access 有效期的分钟数。调大省刷新次数，代价是 token 泄露后可用更久。
  access_expire_minutes: 15
  # refresh 有效期的分钟数×60，默认 7 天。必须不短于 access。
  refresh_expire_hours: 168

# 令牌桶：capacity 是瞬时突发量，rate 是每秒补充的令牌数。
# 穿透或压测时调大，避免多人共用出口 IP 时互相挤掉；生产按容量评估后再定。
# key_prefix 是 Redis key 命名空间，换环境可换值，互不影响。
rate_limit:
  capacity: 10
  rate: 2
  key_prefix: "forum:dev:rate:"

# 同域部署（Nginx 反代 /api、前端也由 Nginx 托管）不需要 CORS，留空即关闭。
# 前后端分开域名或分开端口时才填完整 Origin，含协议，不带路径与结尾斜杠。
# 例："https://forum.example.com"、"http://127.0.0.1:5173"。
# 环境变量：CORS_ALLOWED_ORIGINS=https://a.com,https://b.com
# 不支持通配符 "*"；预检放行的自定义头是 Authorization / Content-Type / X-Request-ID，
# 前端新增自定义请求头时要同步改 internal/middleware/cors.go。
# WebSocket 握手不受 CORS 管，拆域名时还要把同一域名加进下面的 ws.allowed_origins。
cors:
  allowed_origins: []

# 浏览器发的 Origin 是 http://host:port，这里只写 host:port，不带协议。
# 拿到内网穿透域名后，在下面补一行，例如 "xxx.ngrok-free.app"。
ws:
  allowed_origins:
    - "127.0.0.1:5173"

# 日志：统一由 pkg/logging 组装，字段固定为 time / level / msg / request_id + 业务字段。
# level 取 debug / info / warn / error；format 取 json（机器检索）/ text（人眼读）。
# 本机建议 format: text，看日志不用在一堆花括号里找。
log:
  level: info
  format: json
  console: true
  # 本机不落盘（path 留空）。要落盘就填 logs/app.log，写满 max_size_mb 切成 .1、.2。
  file:
    path: ""
    max_size_mb: 50
    max_backups: 7
    max_age_days: 30

# 指标抓取端点 GET /metrics，挂在根路径（不在 /api 下，因此不限流）。
# 指标用 prometheus/client_golang 采集，暴露 http_requests_total、
# http_request_duration_seconds、article_cache_events_total、ws_online_users 等，
# 以及库自带的 go_* / process_* 运行时指标，可直接套现成的 Grafana 看板。
# enabled: false 时完全不注册路由，请求落到统一 404（不是返回空指标）。
# token 非空则要求 Authorization: Bearer <token>；本机看指标留空即可。
# 环境变量：METRICS_ENABLED、METRICS_TOKEN
metrics:
  enabled: true
  token: ""

# 管理类接口的白名单：创建抢楼活动（POST /api/floor-events）、
# 举报处置后台（/api/admin/reports）与标签改名合并（/api/admin/tags）。
# 填的是 users 表的自增 id，不是用户名。
# 这份名单同时决定 GET /users/me 里的 is_admin：前端靠它决定菜单里出不出现
# 「管理后台」入口，两处判定共用 middleware.AdminChecker，不会一处开一处关。
# 留空 = 谁都调不了（安全默认）：忘配时接口是关的，而不是对全部登录用户敞开。
# 列表类型不支持用环境变量覆盖（viper 不会把逗号分隔的字符串拆成切片），改完重启生效。
admin:
  user_ids: []

# 自动标签：发布文章时如果一个标签都没填，让大模型给它起一个。
# 必须 enabled: true 且 api_key 非空才生效，关闭时发布接口不会发任何外部请求。
# 协议是 OpenAI 兼容的 /chat/completions，智谱、DeepSeek、本地 vLLM 都通用，
# 换供应商只改 base_url 与 model，不用改代码。
#
# api_key 是机密：真实的密钥只写在本机的 config.yaml 里（已被 .gitignore 忽略），
# 不要填进这个模板文件，也不要提交到仓库。也可以留空并用环境变量 LLM_API_KEY 覆盖。
# timeout_seconds 同时是「发布请求最多被拖慢多久」：超时就放弃标签，不影响文章发布。
llm:
  enabled: false
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  model: "glm-4-flash"
  api_key: ""
  timeout_seconds: 8
