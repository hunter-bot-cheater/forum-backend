# 生产环境配置模板（会被提交到 Git，里面不得出现真实凭据）。
#
# 用法：
#   1. 复制到服务器上别的位置，例如 /etc/forum/config.yaml，并 chmod 600。
#   2. 真实密码与密钥一律走环境变量，不写进文件：
#        export MYSQL_PASSWORD=...
#        export REDIS_PASSWORD=...
#        export JWT_SECRET=$(openssl rand -hex 32)
#      用 systemd 托管时把它们放进 EnvironmentFile，例如 /etc/forum/forum.env。
#   3. 先迁移再启动（顺序不能反，auto_migrate 已关掉）：
#        CONFIG_PATH=/etc/forum/config.yaml ./forum-migrate
#        CONFIG_PATH=/etc/forum/config.yaml GIN_MODE=release ./forum-server
#   4. 反向代理与静态资源见 deploy/nginx.conf.example。
#
# 与本机 config/config.yaml 的差异只有五处：
#   mysql.auto_migrate 关掉并放大慢查询阈值、限流放大、trusted_proxies 指向本机 Nginx、
#   ws.allowed_origins 换成真实域名、日志落盘。其余键名完全一致，方便对照。

server:
  # 只监听本机，由 Nginx 反代对外。不要改成 0.0.0.0 直接暴露。
  port: 8080
  # 反代在 127.0.0.1 上，只有它转发的 X-Forwarded-For 才可信，
  # 限流才能按真实客户端 IP 分桶。
  # 如果是内网穿透客户端从本机连进来，也填 "127.0.0.1"；直连不用代理则留空 []。
  trusted_proxies:
    - "127.0.0.1"

mysql:
  host: 127.0.0.1
  port: 3306
  user: forum
  # 留空，由 MYSQL_PASSWORD 提供。空密码连不上，正好拦住「忘了配」的情况。
  password: ""
  dbname: forum
  # 生产关掉自动迁移：多实例同时启动会并发建表，改表要作为一次显式部署动作。
  # 建表 / 补列统一走 ./forum-migrate。
  auto_migrate: false
  # 生产慢查询阈值比本机宽松一点：云盘 IO 波动会让 200ms 的查询偶尔超标，
  # 阈值太低会全是噪音。真超过 500ms 的查询才值得改索引。
  slow_query_ms: 500

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  # 连接池上限。0 表示按 CPU 核数算（10 * GOMAXPROCS）。
  # 只有 Redis 侧有限连接配额（云托管免费档、共享实例）时才需要显式写死。
  pool_size: 0

jwt:
  # 留空，由 JWT_SECRET 提供；少于 32 个字符或等于示例占位值会被拒绝启动。
  # 换密钥等于让所有已签发的 token 立刻失效，改之前想清楚。
  secret: ""
  # access 15 分钟，refresh 7 天。两个值都比本机更需要慎重：
  # access 调大等于给被盗 token 更长的可用期，refresh 调小会让老用户频繁重登。
  access_expire_minutes: 15
  refresh_expire_hours: 168

# 生产限流比本机宽：本机 10/2 是给单人调试用的，
# 上线后多人共用一个出口 IP 时会被误伤。按实际并发再调。
# key_prefix 带环境名，多个环境共用一个 Redis 时互不干扰。
rate_limit:
  capacity: 60
  rate: 20
  key_prefix: "forum:prod:rate:"

# 同域部署（Nginx 同时托管前端与 /api）不需要 CORS，留空即关闭。
# 前后端分域名时才填完整 Origin，含协议、不带结尾斜杠，例如：
#   allowed_origins:
#     - "https://forum.example.com"
cors:
  allowed_origins: []

# 浏览器握手的 Origin 只写 host:port，不带协议。
# 换成自己的域名；多个域名各占一行。
ws:
  allowed_origins:
    - "forum.example.com"

# 生产日志：JSON + 落盘。用 systemd 托管时既进 journald 也留一份文件，
# 排查历史问题时比 journalctl 翻页快；没有日志系统的机器（裸机 + 内网穿透）就靠这个文件。
# 上限由 max_size_mb * (max_backups + 1) 决定，这里是 50MB * 8 = 400MB。
# 目录要对运行用户可写，例如 /var/log/forum/app.log（chown 给运行用户）。
log:
  level: info
  format: json
  console: true
  file:
    path: /var/log/forum/app.log
    max_size_mb: 50
    max_backups: 7
    max_age_days: 30

# 指标端点：抓取方通常是本机或内网 Prometheus，靠 Nginx 的 allow/deny 限来源，
# 因此 token 留空、不额外加鉴权。若要跨网段抓取（例如云上托管监控），
# 用环境变量给一个随机 token：METRICS_TOKEN=xxx，抓取请求带 Authorization: Bearer xxx。
# 指标里有路由名与流量规模，裸奔在公网等于把接口清单送给扫描器。
metrics:
  enabled: true
  token: ""

# 管理类接口的白名单（POST /api/floor-events 等）。
# 填 users 表的自增 id，留空表示没人能调。
admin:
  user_ids: []
