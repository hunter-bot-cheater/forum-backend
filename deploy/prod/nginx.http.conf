# 申请证书之前的临时配置：纯 HTTP，站点可用，还没有 TLS。
#
# 为什么需要这一份：nginx 启动时就要读 ssl_certificate 指向的文件，
# 证书不存在会直接启动失败（`nginx: [emerg] cannot load certificate`）。
# 想「先起 nginx 再用它验证域名」，就得先用一份不依赖证书的配置跑起来。
#
# 申请到证书后把 .env 里的 NGINX_CONF 改成 nginx.conf 再重启 web 容器即可，
# 这一步之后本文件在正常运行期间不会被加载。

upstream forum_api {
    server api:8080;
    # 与后端保持长连接，少了它每个请求都要重新握手。
    keepalive 16;
}

# WebSocket 要用。map 必须写在 http 上下文（本文件由 conf.d/*.conf 引入，
# 正是 http 上下文），放进 server {} 会报 unknown directive。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name jiushixixi.xyz www.jiushixixi.xyz;

    # Let's Encrypt 每次签发与续期都要读这个路径下的随机文件名，
    # 内容由 certbot 写进挂载的 ./certbot/www 目录。
    # 路径必须放在最前面：它优先级最高，不会被下面的规则抢走。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/forum-locations.conf;
}
