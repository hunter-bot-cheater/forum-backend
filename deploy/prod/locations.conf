# 站点的全部规则，被 nginx.conf（HTTPS）与 nginx.http.conf（申请证书前的临时态）
# 共同 include。两个 server 块应当只差「监听哪个端口、有没有证书」，
# 其余逻辑留两份的话，改一处漏一处是迟早的事。
#
# 本文件被挂到 /etc/nginx/snippets/forum-locations.conf，
# 在 server {} 内部 include，所以这里写的都是 server 上下文允许的指令。

# 不在响应头里回显 nginx 版本号：版本号是扫描器挑漏洞的第一个线索。
server_tokens off;

# 与后端 limitBody(1 << 20) 对齐，超过 1 MiB 的内容在边缘就挡掉，
# 不让它先传进容器再被拒，白占带宽。
client_max_body_size 1m;

root /usr/share/nginx/html;
index index.html;

# 告诉浏览器不要猜 MIME 类型。上传的头像若被猜成 text/html，就能当脚本执行。
add_header X-Content-Type-Options "nosniff" always;

# 前端产物是文本，压缩比很高；png/jpg 已经压过，再 gzip 只是浪费 CPU。
gzip on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# Vite 打出来的文件名带内容哈希（index-a1b2c3.js），内容变了文件名就变，
# 所以可以按「一年、不可变」缓存。这一条能把回访用户的请求量压到很低。
location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# 入口 HTML 反过来绝不能缓存：它里面引用的正是那些带哈希的文件名，
# 缓存住旧的 index.html，发版后浏览器会一直去要已经删掉的旧资源，白屏。
location = /index.html {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-cache" always;
}

# WebSocket 单独一段。三点必须齐全：
#   1. HTTP/1.1 与 Upgrade/Connection 头：nginx 默认按 HTTP/1.0 反代，
#      逐跳头也不转发，缺了握手直接被后端当成普通请求拒掉（426）。
#   2. 读超时放大：后端心跳 54 秒一次，默认 60 秒只差一点余量，
#      网络一抖动就被判死。300 秒足够容纳几次丢包。
#   3. 其余反代头与 /api/ 保持一致，后端算 IP、算限流都用得上。
location /api/ws/ {
    proxy_pass http://forum_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 图片上传。必须单独写一段，因为上面那句 client_max_body_size 1m 是站点级的，
# 而一张手机照片轻松超过 1 MB——不覆盖的话，上传在 Nginx 这一层就被 413 挡掉，
# 后端根本收不到请求，日志里也看不出任何业务痕迹。
location /api/uploads/ {
    proxy_pass http://forum_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 后端 upload.max_bytes 默认 5 MB，这里给到 6 MB：
    # multipart 的分隔符、字段名也算在请求体里，卡得太死会让
    # 「正好 5 MB 的图」在边缘就被拒，而用户明明没超限。
    client_max_body_size 6m;

    # 关掉请求缓冲：默认 Nginx 会先把整个请求体收到磁盘再转给后端，
    # 一张 5 MB 的图等于写一次盘再读一次。关掉之后是边收边转，
    # 少一次落盘，也少一份临时文件。
    proxy_request_buffering off;

    # 手机网络下 5 MB 传一分钟都正常，默认 30 秒会把人传到一半掐断。
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# 上传的图片。这一段是省流量的核心，三件事叠在一起才成立：
#   1. Nginx 直接从磁盘吐文件，不经过 Go 进程，不占后端连接；
#   2. 强缓存一年 + immutable，回访用户一个字节都不再请求；
#   3. URL 里带内容哈希（后端按 sha256 命名），图一换地址就变，
#      所以「缓存一年」不会让用户看到旧头像，也不需要任何主动刷新缓存的逻辑。
location ^~ /uploads/ {
    # 容器里挂的是宿主机 ./uploads 的只读副本（见 docker-compose.prod.yml）。
    alias /var/www/uploads/;

    # 只写这一条 Cache-Control，不再加 expires：
    # expires 1y 会额外生成一个 Cache-Control: max-age=...，
    # 两个同名响应头虽然浏览器能合并，但抓包时容易让人以为配置写重了。
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 图片是小文件、读得极频繁，缓存文件句柄能省掉每次 open/close 的系统调用。
    # min_uses 1 表示打开过一次就缓存：头像本来就是被反复请求的东西。
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 1;

    # 零拷贝：文件内容不经用户态。tcp_nopush 让 Nginx 把响应头和文件块
    # 攒在一个包里发出去，小文件能少一个 RTT。
    sendfile on;
    tcp_nopush on;

    # 头像不在访问日志里逐条记录：一屏十几张图会把真正的页面请求冲掉，
    # 而这类静态请求的排障价值几乎为零。
    access_log off;

    # 不加 try_files $uri =404：alias 与 try_files 一起用有已知的路径拼接问题，
    # 文件不存在时 alias 自己就会返回 404，不需要额外兜底。
}

# 普通接口。Connection "" 是「清空」而不是「不设置」：
# 清空之后 nginx 才会和后端复用长连接（keepalive 16），
# 每个请求都新建一条 TCP 到 8080，在高频接口上是纯浪费。
location /api/ {
    proxy_pass http://forum_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# 探活与指标在根路径，不是 /api 开头。不单独代理的话会落到下面的 SPA 回退，
# 返回 200 但内容是一张网页，监控以为「服务正常」，实际什么也没探到。
location = /healthz {
    proxy_pass http://forum_api;
    access_log off;
}

location = /readyz {
    proxy_pass http://forum_api;
    access_log off;
}

# 指标里有路由清单、错误率、在线人数，等于把内部结构摊开给外面看。
# 只允许 docker 网段访问（172.28.x 落在 172.16.0.0/12 里），公网一律 403。
location = /metrics {
    allow 172.16.0.0/12;
    deny all;
    proxy_pass http://forum_api;
    access_log off;
}

# 前端用的是 history 路由（/articles/24 这种地址没有对应文件），
# 直接刷新会 404。回退到 index.html 交给 vue-router 处理。
location / {
    try_files $uri $uri/ /index.html;
}
