# 生产 Nginx 配置：80 只做跳转与证书续期，443 才提供站点。
#
# 挂载到 web 容器的 /etc/nginx/conf.d/default.conf，覆盖镜像里那份纯 HTTP 的
# deploy/nginx.docker.conf。改完执行 `docker compose ... restart web` 生效，
# 不需要重新 build 镜像（配置是挂进去的）。

upstream forum_api {
    server api:8080;
    keepalive 16;
}

# WebSocket 升级要用。map 必须在 http 上下文，不能放进 server {}。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name jiushixixi.xyz www.jiushixixi.xyz;

    # 续期同样走 80：certbot 每次都要重新验证域名归属，
    # 而续期时 443 不能停，所以挑战路径必须留在 HTTP 上。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 除了验证路径，其余一律跳 HTTPS。
    # 用 $host 而不是写死域名，是因为这一段同时服务 @ 与 www 两个主机名；
    # $request_uri 保留原始路径和查询串，跳转后不会丢参数。
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # nginx 1.25 起用独立指令开 HTTP/2，旧的 listen 443 ssl http2 写法已废弃。
    http2 on;
    server_name jiushixixi.xyz www.jiushixixi.xyz;

    # 证书路径由 certbot 决定，目录名就是主域名。
    # fullchain 是「站点证书 + 中间证书」，只给站点证书的话
    # Android 老版本、部分 Java 客户端会报证书链不完整。
    ssl_certificate     /etc/letsencrypt/live/jiushixixi.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiushixixi.xyz/privkey.pem;

    # 只放开 TLS 1.2/1.3。1.0/1.1 已被主流浏览器判为不安全，
    # 留着只会让扫描报告多几条红色。
    ssl_protocols TLSv1.2 TLSv1.3;

    # 会话复用：TLS 握手要两次往返，复用能把回访用户的握手开销降到接近零。
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS：确认长期只用 HTTPS 再打开。
    # 一旦下发，浏览器会记住这个域名一年内不许走 HTTP，
    # 这期间证书一旦出问题，连「临时用 HTTP 顶一下」都做不到。
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/forum-locations.conf;
}
