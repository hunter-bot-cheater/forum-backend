# 容器内的 nginx 配置。与 deploy/nginx.conf.example 同为「同域部署」，
# 差别是 upstream 用 compose 的服务名，且没有证书（证书由外层网关或反代负责）。
#
# 本文件被 deploy/web.Dockerfile 拷进镜像，改完要重新 build 才会生效。

upstream forum_api {
    server api:8080;
    keepalive 16;
}

# Upgrade 与 Connection 是逐跳头，nginx 默认不转发，必须显式设置。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 与后端 limitBody(1 << 20) 一致，超过 1 MiB 在边缘就挡掉。
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite 产物带内容哈希，可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html 不能缓存，否则发版后浏览器一直拿旧入口。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # WebSocket 握手走 /api/ws/。后端心跳 54 秒，默认 60 秒读超时余量太小。
    location /api/ws/ {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传：站点级 1 MiB 不够用，单独放宽到 6 MB（后端上限 5 MB + 表单开销）。
    location /api/uploads/ {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 图片文件由后端吐。本机这套 compose 没给 web 挂数据卷，
    # 让后端读它自己的 uploads/ 最省事；生产是 Nginx 直接读文件。
    # 缓存头与生产保持一致，否则「开发看着好好的、上线回退变慢」这类差异很难查。
    location /uploads/ {
        proxy_pass http://forum_api;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /api/ {
        proxy_pass http://forum_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 探活与指标在根路径，不单独代理会被下面的 SPA 回退成 index.html。
    location = /healthz {
        proxy_pass http://forum_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://forum_api;
        access_log off;
    }

    # 指标含路由清单与流量规模，只在容器网络内可取，公网一律拒绝。
    location = /metrics {
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://forum_api;
        access_log off;
    }

    # SPA 刷新子路由时回退到 index.html，交给 vue-router 处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
